<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>BCC OIDC Mock - Login</title>
    <script src="tailwind.js"></script>
    <script src="vue.global.js"></script>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
</head>
<body>
<div id="app">
    <div class="min-h-screen flex flex-col items-center justify-center bg-gray-100">
        <div class="flex lg:min-w-2xl justify-end invisible lg:visible">
            <img class="h-48 -mt-48" src="bg.png"/>
        </div>

        <form @submit.prevent="handleLogin">

            <div class="flex flex-col w-full lg:min-w-2xl bg-white rounded-lg shadow-md p-6 gap-3">
                <h1 class="text-3xl">BCC Test-innlogging</h1>
                <div class="grid lg:grid-cols-2 gap-3">
                    <!-- Organization Selection -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700" for="organization">Velg Organization</label>
                        <select
                                @change="onOrganizationChange"
                                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                id="organization"
                                size="12"
                                v-model="selectedOrganizationId"
                        >
                            <!--                        <option disabled value="">Select a Organization</option>-->
                            <option :key="organization.name" :value="organization.name"
                                    v-for="organization in organizationer">
                                {{ organization.name }}
                            </option>
                        </select>
                    </div>


                    <!-- person Selection -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700" for="person">Velg person</label>
                        <select
                                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                id="person"
                                size="12"
                                v-model="selectedPersonId"
                        >
                            <!--                        <option disabled value="">Select a person</option>-->
                            <option :key="person.name" :value="person.name" v-for="person in selectedOrganization.persons">
                                {{ person.name }}
                            </option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-between items-center mt-1 w-full px-3 py-2  border border-gray-300 rounded-md shadow-sm">
                    <div class="">
                        <p>{{ selectedPerson?.name ?? '&nbsp;' }}</p>
                        <p>{{ selectedPerson?.email ?? '&nbsp;' }}</p>
                        <p>{{ selectedPerson?.personUid ?? '&nbsp;' }}</p>
                    </div>
                    <button
                            class="py-2 px-4 text-white bg-indigo-600 rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
                            type="submit"
                    >
                        Logg inn
                    </button>
                </div>

            </div>
        </form>

    </div>
</div>
<script>
    const {createApp, ref, computed, watch} = Vue

    createApp({
        setup() {
            const organizationer = ref([])
            fetch("/persons").then(async r => {
                organizationer.value = await r.json()
                selectedOrganizationId.value = organizationer.value[0].name
                selectedPersonId.value = selectedOrganization.value.persons[0].name
            })

            const selectedOrganizationId = ref()
            const selectedPersonId = ref()

            const selectedOrganization = computed(() => {
                return organizationer.value.find(f => f.name === selectedOrganizationId.value) || {persons: []}
            })

            const selectedPerson = computed(() => {
                return selectedOrganization.value.persons.find(r => r.name === selectedPersonId.value)
            })

            function onOrganizationChange() {
                selectedPersonId.value = selectedOrganization.value.persons.length > 0 ? selectedOrganization.value.persons[0].name : ''
            }

            watch(selectedPerson, person => personUid.value = person?.personUid)

            const personUid = ref('')

            async function handleLogin() {
                let idx = location.href.toLowerCase().indexOf("?returnurl=");
                let returnUrl = ""
                if (idx > 0) {
                    returnUrl = location.href.substring(idx + 11);
                }

                let body = {
                    email: selectedPerson.value.email,
                    personUid: personUid.value,
                    name: selectedPerson.value.name,
                    returnUrl: returnUrl,
                };

                const response = await fetch("/spa/login",
                    {
                        method: "POST",
                        headers: {"content-type": "application/json"},
                        credentials: "include",
                        body: JSON.stringify(body)
                    });

                if (response.status === 400 || response.status === 200) {
                    const resp = await response.json();
                    if (resp.error) {
                        // err.textContent = resp.error;
                        // err.classList.remove("hide");
                    } else {
                        window.location = resp.validReturnUrl;
                    }

                }
            }

            return {
                personUid,
                organizationer,
                selectedOrganizationId,
                selectedPersonId,
                selectedOrganization,
                selectedPerson,
                handleLogin,
                onOrganizationChange,
            }
        }
    }).mount('#app')
</script>

</body>
</html>
