<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>BCC OIDC Mock - Error</title>
    <script src="tailwind.js"></script>
    <script src="vue.global.js"></script>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    
</head>
<body>

<div id="app">
    <div class="min-h-screen flex flex-col items-center justify-center bg-gray-100 p-4">
        <div class="flex w-full max-w-xl bg-red-500 justify-end">
            <img src="bg.png" class="object-contain h-48 -mt-48"/>
        </div>
        <div class="flex flex-col w-full max-w-3xl bg-white rounded-lg shadow-md p-6 gap-3">
            <h1 class="text-xl font-bold">Feilmelding</h1>

            <div class="">
                {{error}}: <em>{{errorDescription}}</em>
            </div>
        </div>
    </div>
</div>

<script>
    const {createApp, ref} = Vue

    createApp({
        setup() {

            const error = ref()
            const errorDescription = ref()

            let idx = location.href.toLowerCase().indexOf("?errorid=");
            if (idx > 0) {
            }
            const errorId = location.href.substring(idx + 9);

            (async () => {
                const response = await fetch("/spa/error?errorId=" + errorId,
                    {
                        method: "GET",
                        credentials: "include"
                    });

                if (response.status === 200) {
                    const data = await response.json();
                    error.value = data.error
                    if (data.errorDescription) {
                        errorDescription.value = data.errorDescription;
                    }
                }
            })();

            return {
                error,
                errorDescription
            }
        }
    }).mount("#app")

</script>
</body>
</html>
